# CI: the pure core suite is a fast, mandatory first gate; integration tests run only
# after it passes, against the same docker-compose stack used locally (spec §13).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy-config:
    name: Live deploy files (compose + Caddyfile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: # dummy values: this only checks the files parse, nothing starts
      DOMAIN: localhost
      POSTGRES_PASSWORD: x
      SECRET_ENCRYPTION_KEY: x
      INGEST_TOKEN: x
      GRAFANA_ADMIN_PASSWORD: x
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml --profile demo config --quiet
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.tunnel.yaml -f deploy/compose.monitoring.yaml --profile demo config --quiet
      - name: Prometheus configs and alert rules (promtool)
        run: |
          for cfg in deploy/prometheus.yml observability/prometheus.yml observability/k8s/prometheus.yml; do
            docker run --rm --entrypoint promtool -v "$PWD/$(dirname $cfg)/$(basename $cfg):/c/prometheus.yml:ro"               -v "$PWD/observability/alerts.yml:/c/alerts.yml:ro" prom/prometheus:v2.53.0 check config /c/prometheus.yml
          done
      - run: kubectl kustomize observability > /dev/null
      - run: docker run --rm -e DOMAIN -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8.4 caddy validate --config /etc/caddy/Caddyfile

  python-sdk:
    name: Python receiver SDK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # the oldest version pyproject.toml claims
      - uses: actions/setup-node@v4 # the cross-language tests sign with core/signing.js
        with:
          node-version: 22
      # The official Standard Webhooks library, to prove Reliant's signatures verify with it.
      - run: pip install standardwebhooks==1.1.0
      - run: python -m unittest discover -s tests -v
        working-directory: sdk/python

  terraform:
    name: Terraform (fmt, validate, plan against LocalStack) + AWS overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Start LocalStack (KMS, S3, STS, IAM, EC2)
        run: docker compose --profile aws up -d --wait reliant_localstack
        working-directory: .
      # Never touches AWS: localstack=true sends every call to localhost:4566.
      - run: terraform plan -input=false -var localstack=true
      # The overlay renders with placeholder inputs (the real ones come from terraform output).
      - name: Render k8s/aws
        working-directory: k8s/aws
        run: |
          echo DB_HOST=x > config.env
          echo DB_PASSWORD=x > secrets.env
          echo placeholder > rds-global-bundle.pem
          kubectl kustomize . > /dev/null

  integration:
    name: Integration tests (Postgres + Redis + Redpanda + LocalStack KMS/S3)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: reliant
      DB_PASSWORD: reliant_dev_password # matches docker-compose.yml; throwaway CI database
      DB_NAME: reliant
      KAFKA_BROKER: localhost:9092
      REDIS_URL: redis://localhost:6379
      ALLOW_PRIVATE_ENDPOINTS: "true" # the tests' customer endpoints run on localhost
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      # LocalStack stands in for AWS: every endpoint secret in the run is KMS envelope-
      # encrypted, and tests/aws.test.js covers KMS and the S3 archive directly.
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KMS_KEY_ID: alias/reliant-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fresh per run, never stored: these only protect a database that dies with the job.
      - name: Generate test-only secrets
        run: |
          echo "SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INGEST_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start Postgres, Redis, Redpanda, LocalStack
        run: docker compose --profile aws up -d --wait

      # migrate needs Postgres AND Kafka, so retrying it doubles as the readiness check.
      - name: Wait for services, then migrate
        run: |
          for i in $(seq 1 30); do
            if npm run -s migrate; then exit 0; fi
            echo "services not ready yet (attempt $i), retrying in 2s..."
            sleep 2
          done
          echo "services never became ready"; docker compose logs; exit 1

      - run: npm run test:integration -- --test-timeout=120000

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
