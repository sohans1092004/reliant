# Prometheus inside the cluster (observability/kustomization.yaml): scrapes every Reliant pod
# that carries prometheus.io/scrape: "true", on its container port named "metrics".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml # the same rules as the local Prometheus

scrape_configs:
  - job_name: reliant # alerts and dashboards select job="reliant"
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [reliant] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: process # same label the local config sets: ingest, consumer, worker, ...
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
