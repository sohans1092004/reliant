# Scrapes the Reliant processes running on the host (npm run ingest / consumer / ...).
# Start with: docker compose --profile observability up -d   ->  http://localhost:9090
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: reliant
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels: { process: ingest }
      - targets: ['host.docker.internal:9101']
        labels: { process: consumer }
      - targets: ['host.docker.internal:9102']
        labels: { process: worker }
      - targets: ['host.docker.internal:9103']
        labels: { process: dashboard }
      - targets: ['host.docker.internal:9104']
        labels: { process: retry-publisher }
