# Local-cluster stand-ins for what AWS would provide (RDS, ElastiCache, MSK).
# Single replica, no persistence (emptyDir): deleting a pod wipes its data. Dev only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Literal user/db, NOT the app ConfigMap: kustomize renames that ConfigMap whenever any
          # app setting changes, which would restart (and, with emptyDir, wipe) the database.
          # Keep these in sync with DB_USER / DB_NAME in kustomization.yaml.
          env:
            - { name: POSTGRES_USER, value: reliant }
            - { name: POSTGRES_DB, value: reliant }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: reliant-secrets, key: DB_PASSWORD } } }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { port: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { port: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels: { app.kubernetes.io/name: redpanda }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redpanda }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redpanda }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.2
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=512M
            - --overprovisioned
            - --node-id=0
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            # What clients are told to connect to after bootstrap: the Service's full name, so it
            # resolves from any namespace (KEDA's Kafka scaler runs in "keda").
            - --advertise-kafka-addr=PLAINTEXT://redpanda.reliant.svc.cluster.local:9092
          ports:
            - { containerPort: 9092 }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector: { app.kubernetes.io/name: redpanda }
  ports:
    - { port: 9092 }
