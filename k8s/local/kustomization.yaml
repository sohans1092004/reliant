# Local cluster (Docker Desktop Kubernetes, kind, minikube):
#   docker build -t reliant:dev .
#   cp k8s/local/secrets.env.example k8s/local/secrets.env   # then fill in real values
#   kubectl apply -k k8s/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reliant
resources:
  - namespace.yaml
  - ../app
  - infra.yaml

images:
  - name: reliant
    newName: reliant
    newTag: dev # built locally; Docker Desktop's cluster sees local images (kind: `kind load docker-image reliant:dev`)

# The tag never changes locally, so with the default (IfNotPresent) the node kept running
# the first reliant:dev it saw: a rebuilt image plus `rollout restart` silently ran the
# old code (found by incident 001's Kubernetes drill). Always re-resolves the tag.
patches:
  - target: { kind: Deployment, labelSelector: app.kubernetes.io/name=reliant }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Job, labelSelector: app.kubernetes.io/name=reliant }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

configMapGenerator:
  - name: reliant-config
    literals:
      # Fully qualified, so they also resolve from other namespaces (KEDA's scalers run in "keda").
      - DB_HOST=postgres.reliant.svc.cluster.local
      - DB_PORT=5432
      - DB_USER=reliant
      - DB_NAME=reliant
      - KAFKA_BROKER=redpanda.reliant.svc.cluster.local:9092
      - REDIS_URL=redis://redis.reliant.svc.cluster.local:6379
      - RETRY_FAST_MODE=false
      # Dev only: lets test endpoints run inside the cluster (private IPs). Never in prod.
      - ALLOW_PRIVATE_ENDPOINTS=true
      # Dev only: migrate seeds tenant_a / tenant_b (API keys published in seed-dev.sql).
      - DEV_SEED=true
  - name: redpanda-bootstrap
    files:
      - redpanda-bootstrap.yaml

secretGenerator:
  - name: reliant-secrets
    envs:
      - secrets.env # gitignored; copy secrets.env.example
