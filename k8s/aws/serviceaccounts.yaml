# One per process that calls AWS. EKS Pod Identity maps each to its IAM role by name
# (infra/terraform/iam.tf, aws_eks_pod_identity_association), so they need no annotations.
apiVersion: v1
kind: ServiceAccount
metadata: { name: consumer }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: worker }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: dashboard }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: migrate }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: retention }
