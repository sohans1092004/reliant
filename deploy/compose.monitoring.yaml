# Prometheus + Grafana for the live stack, with the same alert rules and dashboard as local dev.
#   GRAFANA_ADMIN_PASSWORD=... in deploy/.env, then add -f compose.monitoring.yaml to every command:
#   docker compose -f compose.yaml [-f compose.tunnel.yaml] -f compose.monitoring.yaml up -d --wait
# Grafana listens on 127.0.0.1:3003 only: never through Caddy or the tunnel. From another
# machine, use an SSH tunnel: ssh -L 3003:127.0.0.1:3003 <vm>, then http://localhost:3003.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:3003:3000"]
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  prometheus:
  grafana:
